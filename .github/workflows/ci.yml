name: Checks

# Runs on pull requests (and on main after merging) to catch anything that
# would break the site: code checks, the recipe content checks, the Firestore
# security rules, and the whole site in a real browser.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore processed photos
        uses: actions/cache@v4
        with:
          path: |
            public/photos
            .cache
          key: photos-${{ hashFiles('content/photos/**', 'scripts/build-images.mjs') }}
          restore-keys: photos-
      # Processes any new photos, so the checks below know about them.
      - run: npm run images
      - run: npm run lint
      - run: npm run typecheck
      # Includes the content checks: every recipe's category, tags, photos and links.
      - run: npm test

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package.json') }}
          restore-keys: firebase-emulators-
      - run: npm ci
      - run: npm run test:rules

  browser:
    name: Site in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore processed photos
        uses: actions/cache@v4
        with:
          path: |
            public/photos
            .cache
          key: photos-${{ hashFiles('content/photos/**', 'scripts/build-images.mjs') }}
          restore-keys: photos-
      # Built without the Firebase settings, as a visitor sees it before
      # comments are set up.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the test report if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
